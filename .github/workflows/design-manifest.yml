name: Design manifest
on:
  pull_request:
    branches: [main]
    paths:
      - "assets/**"
      - "docs/**"
      - "tools/generators/**"
      - "tools/scripts/check_manifest.py"
      - "tools/tests/test_design_manifest.py"
      - ".github/workflows/design-manifest.yml"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -I tools/scripts/check_manifest.py
      - run: python3 -I tools/tests/test_design_manifest.py
