<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#14101a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png">
<title>Tiên Nghịch 2D · engine spike</title>
<style>
  html,body{margin:0;height:100%;background:#0b0810;overflow:hidden;overscroll-behavior:none;-webkit-touch-callout:none}
  body{display:flex;align-items:center;justify-content:center}
  #game{position:relative;touch-action:none}
  #game canvas{display:block}
  #hud{position:fixed;left:calc(env(safe-area-inset-left,0px) + 6px);top:calc(env(safe-area-inset-top,0px) + 4px);color:#d7c9a3;font:11px/1.2 ui-monospace,monospace;text-shadow:0 1px #000;pointer-events:none;z-index:2}
  #rotate{display:none;position:fixed;inset:0;z-index:10;background:#14101a;color:#d7c9a3;align-items:center;justify-content:center;flex-direction:column;gap:14px;text-align:center;font:600 20px/1.3 system-ui;padding:24px}
  #rotate .ico{width:64px;height:40px;border:4px solid #d7c9a3;border-radius:8px;animation:turn 2.4s ease-in-out infinite}
  #rotate small{font:400 15px system-ui;opacity:.8}
  @keyframes turn{0%,20%{transform:rotate(90deg)}60%,100%{transform:rotate(0)}}
  @media (orientation:portrait) and (pointer:coarse){#rotate{display:flex}}
</style>
</head>
<body>
<div id="game"></div>
<div id="hud"></div>
<div id="rotate" role="alert"><div class="ico"></div><div>Xoay ngang thiết bị<br><small>Rotate your device to landscape</small></div></div>
<script type="module" src="./src/main.ts"></script>
</body>
</html>
