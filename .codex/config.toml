# Project-scoped Codex config: loaded only after this project is trusted (see studio/mcp/README.md).
# Relative path on purpose: each git worktree runs its own copy of the server and sees its own files.
[mcp_servers.studio]
command = "node"
args = ["studio/mcp.mjs", "--scope", "author", "--agent", "codex"]
startup_timeout_sec = 20
default_tools_approval_mode = "writes"
