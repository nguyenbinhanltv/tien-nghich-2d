<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pixel Kiln</title>
    <link rel="stylesheet" href="./ui/tokens.css" />
    <link rel="stylesheet" href="./ui/components.css" />
    <link rel="stylesheet" href="./ui/shell.css" />
  </head>
  <body>
    <a class="skip-link" href="#main" data-i18n="app.skip">Skip to content</a>
    <div id="app" class="shell">
      <aside class="rail" id="rail" aria-label="Studio">
        <div class="brand" id="brand"></div>
        <nav id="nav" aria-label="Destinations"></nav>
        <div class="rail-tools" id="rail-tools"></div>
      </aside>
      <button type="button" class="rail-scrim" id="rail-scrim" tabindex="-1" aria-hidden="true"></button>
      <div class="column">
        <header class="topbar" id="topbar"></header>
        <main id="main" class="main" tabindex="-1"></main>
      </div>
    </div>
    <div id="live" class="sr-only" role="status" aria-live="polite"></div>
    <noscript>The studio needs JavaScript. It has no build step and no dependencies.</noscript>
    <script type="module" src="./ui/shell.js"></script>
  </body>
</html>
