<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hall of the Evening Bell · Heng Yue</title><link rel="stylesheet" href="courtyard.css"><link rel="stylesheet" href="hall.css"></head>
<body><header><span class="seal" aria-hidden="true">山</span><strong>Tiên Nghịch</strong><span class="division"></span><a href="./">Evening Bell courtyard</a></header>
<main><div class="heading"><div><p class="eyebrow">Heng Yue Sect</p><h1>Hall of the Evening Bell</h1></div><span id="health" aria-label="Health"></span></div>
<section><div class="frame"><canvas id="hall" width="320" height="192" aria-label="Training hall with its exit in the north wall"></canvas></div>
<div class="journal"><div class="diamond" aria-hidden="true">◇</div><div><h2 id="objective">Entering the hall…</h2><p id="hint" role="status"></p></div></div>
<div id="choices" hidden></div><button id="restart" hidden>Return to the courtyard</button></section>
<div class="controls"><div class="pad" aria-label="Move"><button data-key="up" aria-label="Move north">▲</button><button data-key="left" aria-label="Move west">◀</button><button data-key="down" aria-label="Move south">▼</button><button data-key="right" aria-label="Move east">▶</button></div>
<div class="actions"><button data-key="attack">Cast <kbd>J</kbd></button><button data-key="dash">Dash <kbd>Space</kbd></button></div></div>
<footer>Move with WASD or arrows. Hold Cast to fire toward the guard.</footer></main><script type="module" src="hall.js"></script></body></html>
